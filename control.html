<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>本部 進行管理｜県インドア大会</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --main:#1a4a2e;--main-light:#e8f1eb;--gold:#c8a020;--red:#b33030;--blue:#0056b3;
  --white:#fff;--gray:#f5f5f0;--line:#e2e2da;--text:#222;--text-light:#666;--radius:10px
}
html{font-size:15px}
body{font-family:'Noto Sans JP',sans-serif;background:var(--gray);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#3a1a1a,#7a2a2a);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.header h1{font-size:1rem;font-weight:900}
.header h1 small{display:block;font-size:.66rem;font-weight:500;opacity:.85}
.divtabs{display:flex;gap:6px;flex-wrap:wrap}
.divtabs a{padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:.78rem;font-weight:700}
.divtabs a.on{background:#f3d36b;color:#3a2e00}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:none;padding:7px 10px;border-radius:8px;font-size:.75rem;font-family:inherit;cursor:pointer;text-decoration:none}
.main{max-width:1200px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.info{font-size:.82rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col h2{font-size:.95rem;font-weight:900;color:#fff;background:var(--main);border-radius:8px;padding:6px 10px;margin-bottom:8px;text-align:center}
.card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--line);margin-bottom:8px;overflow:hidden}
.card.live{border-color:var(--red);box-shadow:0 0 0 2px rgba(179,48,48,.25)}
.card.call{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,160,32,.3)}
.card.done{background:#fbfbf8}
.c-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;background:#fafaf6;border-bottom:1px solid var(--line);font-size:.75rem}
.c-head .no{font-weight:900;color:var(--main)}
.c-head .rd{color:var(--text-light)}
.c-head .tm{font-weight:700}
.c-body{padding:6px 10px}
.side{padding:2px 0;font-size:.9rem}
.side .nm{font-weight:700}
.side .sb{font-size:.7rem;color:var(--text-light);margin-left:4px}
.side.tbd .nm{color:#999;font-weight:500;font-size:.8rem}
.side.win .nm{color:var(--main)}
.side.win .nm::before{content:'○ ';color:var(--red)}
.side.lose .nm{color:#888}
.vs{font-size:.65rem;color:#aaa;margin:-2px 0}
.score{font-weight:900;font-size:.9rem;color:var(--main)}
.ctl{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;border-top:1px dashed var(--line);background:#fcfcf9}
.ctl button{border:1.5px solid #ccc;background:#fff;border-radius:6px;padding:5px 8px;font-size:.74rem;font-family:inherit;font-weight:700;cursor:pointer;color:#333}
.ctl button.p{background:var(--main);border-color:var(--main);color:#fff}
.ctl button.g{background:var(--gold);border-color:var(--gold);color:#2b2300}
.ctl button.r{border-color:var(--red);color:var(--red)}
.ctl button:disabled{opacity:.4;cursor:not-allowed}
.ctl .sp{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:900;white-space:nowrap}
.b-wait{background:#eee;color:#666}
.b-call{background:#fff3cd;color:#7a5d00}
.b-live{background:var(--red);color:#fff}
.b-done{background:var(--main-light);color:var(--main)}
.b-two{background:#e6f0fb;color:var(--blue)}
.panel{background:#fff;border-radius:var(--radius);padding:12px;margin-bottom:12px;border:1.5px solid var(--line)}
.panel h3{font-size:.88rem;font-weight:900;color:var(--main);margin-bottom:8px}
.cfg{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.cfg label{font-size:.72rem;font-weight:700;color:var(--text-light);display:block}
.cfg input{width:90px;padding:7px;border:2px solid #ddd;border-radius:6px;font-size:.9rem;font-family:inherit}
.btn{padding:8px 14px;border-radius:8px;border:none;background:var(--main);color:#fff;font-weight:700;font-family:inherit;cursor:pointer;font-size:.82rem}
.btn-out{background:#fff;color:var(--main);border:2px solid var(--main)}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rk{border:1.5px solid var(--line);border-radius:8px;padding:8px}
.rk h4{font-size:.82rem;margin-bottom:6px}
.rk table{width:100%;border-collapse:collapse;font-size:.76rem;margin-bottom:6px}
.rk td{padding:3px 4px;border-bottom:1px solid #eee}
.rk select{width:100%;padding:6px;border:2px solid #ddd;border-radius:6px;font-family:inherit;font-size:.82rem;margin-bottom:4px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;padding:16px;overflow-y:auto}
.overlay.show{display:block}
.modal{max-width:480px;margin:30px auto;background:#fff;border-radius:14px;padding:16px}
.modal h3{font-size:1rem;margin-bottom:10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pick button{padding:14px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer}
.pick button.on{border-color:var(--main);background:var(--main-light)}
.pick button small{display:block;font-size:.7rem;font-weight:500;color:var(--text-light)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.quick button{padding:8px 12px;border-radius:8px;border:1.5px solid #ccc;background:#fff;font-family:inherit;font-weight:700;cursor:pointer}
.quick button.on{border-color:var(--main);background:var(--main);color:#fff}
.modal input{width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:1rem;font-family:inherit;margin-bottom:12px}
.mbtns{display:flex;gap:8px}
.mbtns .btn{flex:1;padding:12px}
.login{max-width:360px;margin:60px auto;background:#fff;border-radius:12px;padding:20px}
.login input{width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;margin:10px 0;font-size:1rem}
.err{color:var(--red);font-size:.82rem;font-weight:700;margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:.85rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.error{background:var(--red)}
.muted{font-size:.72rem;color:var(--text-light)}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <h1><small id="hdSub">本部用</small><span id="hdTitle">進行管理</span></h1>
    <div class="divtabs" id="divTabs"></div>
    <div style="display:flex;gap:6px"><a class="hbtn" id="pubLink" target="_blank">公開ページ</a><button class="hbtn" onclick="load(true)">↻</button></div>
  </div>
</header>

<div class="login" id="loginView" style="display:none">
  <h3>本部ログイン（管理パスワード）</h3>
  <input type="password" id="pwInput" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" style="width:100%" onclick="login()">ログイン</button>
  <div class="err" id="loginErr"></div>
</div>

<main class="main" id="appView" style="display:none">
  <div class="bar"><div class="info" id="info"></div></div>
  <div id="board"></div>
  <div class="panel" id="rankPanel" style="display:none">
    <h3>予選リーグの順位（1位・2位を確定すると決勝トーナメントの対戦が決まります）</h3>
    <div class="ranks" id="ranks"></div>
  </div>
  <div class="panel">
    <h3>目安時間（変更すると予定時刻をすぐ再計算します）</h3>
    <div class="cfg">
      <div><label>競技開始</label><input id="cStart"></div>
      <div><label>5ゲーム（分）</label><input id="cG5" inputmode="numeric"></div>
      <div><label>7ゲーム（分）</label><input id="cG7" inputmode="numeric"></div>
      <div><label>団体 次戦まで（分）</label><input id="cGapT" inputmode="numeric"></div>
      <div><label>個人 次戦まで（分）</label><input id="cGapI" inputmode="numeric"></div>
      <button class="btn" onclick="saveConfig()">保存して再計算</button>
    </div>
    <div class="muted" style="margin-top:6px">団体戦の1試合は、1面進行＝5ゲーム×3、2面展開＝5ゲーム×2で見積もります。団体戦の「次戦まで」は、オーダー提出（10分）とコート集合（15分）を見込んだ間隔です。</div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ★ GASのウェブアプリURL */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxYHQcJ6BqAOKWWa_n1368nOitIVPfNC3SOPYk58-Lm3UtCPIT6slKdcVz0C9SvpCJJ/exec';

var DIVS = [['MI', '男子個人戦'], ['WI', '女子個人戦'], ['MT', '男子団体戦'], ['WT', '女子団体戦']];
var PW_KEY = 'iwateIndoorAdminPw';
var params = new URLSearchParams(location.search);
var divCode = params.get('div') || 'MI';
var pw = '';
var DATA = null;
var busy = false;
var modalOpen = false;
var res = { id: '', winner: '', score: '' };

function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' error' : '');
  setTimeout(function () { t.className = 'toast'; }, isErr ? 5000 : 2200);
}

function api(body) {
  body.pw = pw;
  body.div = divCode;
  return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
    .then(function (r) { return r.text(); })
    .then(function (text) {
      var d;
      try { d = JSON.parse(text); } catch (e) { throw new Error('サーバーの応答を読み取れません: ' + text.substring(0, 100)); }
      if (d.status !== 'ok') { var err = new Error(d.message || 'エラー'); err.code = d.code; throw err; }
      return d;
    });
}

/* ========== ログイン ========== */
function login() {
  pw = document.getElementById('pwInput').value;
  load(true).then(function () {
    try { sessionStorage.setItem(PW_KEY, pw); } catch (e) { /* 保存できなくても続行 */ }
  }).catch(function () {});
}

function load(manual) {
  if (busy || modalOpen) return Promise.resolve();
  return api({ action: 'adminCtlLoad' }).then(function (d) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('appView').style.display = 'block';
    apply(d);
    if (manual === true) toast('最新の状態に更新しました');
  }).catch(function (err) {
    if (err.code === 'auth' || !DATA) {
      document.getElementById('appView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('loginErr').textContent = err.message;
    } else {
      toast('更新できませんでした：' + err.message, true);
    }
    throw err;
  });
}

function apply(d) {
  DATA = d;
  document.getElementById('hdSub').textContent = d.date + '　' + d.venue;
  document.getElementById('hdTitle').textContent = d.division.name + '　進行管理（本部）';
  document.title = d.division.name + ' 進行管理｜本部';
  var c = d.config;
  if (document.activeElement && document.activeElement.tagName !== 'INPUT') {
    document.getElementById('cStart').value = c.start;
    document.getElementById('cG5').value = c.g5;
    document.getElementById('cG7').value = c.g7;
    document.getElementById('cGapT').value = c.gapTeam;
    document.getElementById('cGapI').value = c.gapIndiv;
  }
  var done = 0, i;
  for (i = 0; i < d.matches.length; i++) if (d.matches[i].state === '終了') done++;
  document.getElementById('info').innerHTML = '終了 <strong>' + done + '</strong> / ' + d.matches.length + '試合　終了見込み <strong>' + esc(d.finishPlan || '-') + '</strong>　（更新 ' + esc(d.updated) + '）';
  render();
  renderRanks();
}

/* ========== 表示 ========== */
function stateBadge(m) {
  if (m.state === '試合中') return '<span class="badge b-live">試合中</span>';
  if (m.state === '呼出') return '<span class="badge b-call">コール</span>';
  if (m.state === '終了') return '<span class="badge b-done">終了</span>';
  return '<span class="badge b-wait">待機</span>';
}

function timeText(m) {
  if (m.state === '終了') return m.note === '不戦勝' ? '不戦勝' : (m.start ? m.start + '〜' + m.end : '');
  if (m.state === '試合中') return (m.start ? m.start + '開始' : '') + '（〜' + m.planEnd + '見込）';
  return m.plan ? '予定 ' + m.plan : '';
}

function sideHtml(m, s, which) {
  var cls = 'side';
  if (!s.decided) cls += ' tbd';
  else if (m.state === '終了' && m.winner) cls += m.winner === which ? ' win' : ' lose';
  return '<div class="' + cls + '"><span class="nm">' + esc(s.label) + '</span>' + (s.sub ? '<span class="sb">' + esc(s.sub) + '</span>' : '') + '</div>';
}

function cardHtml(m, court) {
  var cls = 'card' + (m.state === '試合中' ? ' live' : m.state === '呼出' ? ' call' : m.state === '終了' ? ' done' : '');
  var ready = m.left.decided && m.right.decided;
  var isTeam = DATA.division.type === 'team';
  var h = '<div class="' + cls + '">';
  h += '<div class="c-head"><span><span class="no">第' + m.no + '試合</span> <span class="rd">' + esc(m.round) + '</span>' + (m.two ? ' <span class="badge b-two">2面展開</span>' : '') + '</span>';
  h += '<span>' + stateBadge(m) + ' <span class="tm">' + esc(timeText(m)) + '</span></span></div>';
  h += '<div class="c-body">' + sideHtml(m, m.left, 'L') + '<div class="vs">' + (m.state === '終了' && m.score ? '<span class="score">' + esc(m.score) + '</span>' : 'vs') + '</div>' + sideHtml(m, m.right, 'R') + '</div>';
  if (m.note !== '不戦勝' && (!m.two || court === 'A')) {
    var id = esc(m.id);
    h += '<div class="ctl">';
    if (m.state === '待機') h += '<button class="g" ' + (ready ? '' : 'disabled') + ' onclick="op(\'' + id + '\',\'state\',\'呼出\')">コール</button>';
    if (m.state === '待機' || m.state === '呼出') h += '<button class="p" ' + (ready ? '' : 'disabled') + ' onclick="op(\'' + id + '\',\'state\',\'試合中\')">開始</button>';
    if (m.state !== '待機' || ready) h += '<button class="p" ' + (ready ? '' : 'disabled') + ' onclick="openResult(\'' + id + '\')">' + (m.state === '終了' ? '結果修正' : '結果入力') + '</button>';
    if (m.state !== '待機') h += '<button class="r" onclick="undo(\'' + id + '\')">戻す</button>';
    h += '<span class="sp"></span>';
    if (m.state !== '終了' && m.state !== '試合中') {
      h += '<button onclick="op(\'' + id + '\',\'up\')" title="前へ">▲</button><button onclick="op(\'' + id + '\',\'down\')" title="後へ">▼</button>';
      h += '<button onclick="op(\'' + id + '\',\'court\')">⇄ ' + (m.court === 'A' ? 'Bへ' : 'Aへ') + '</button>';
      if (isTeam) h += '<button onclick="op(\'' + id + '\',\'two\')">' + (m.two ? '1面に戻す' : '2面展開') + '</button>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

function render() {
  var ms = DATA.matches;
  if (!ms.length) {
    document.getElementById('board').innerHTML = '<div class="panel">進行表がまだ作成されていません。管理画面の「組合せ」タブで組合せを保存し、「進行表を作成」を押してください。</div>';
    return;
  }
  var html = '<div class="cols">';
  var courts = ['A', 'B'];
  var c, i;
  for (c = 0; c < 2; c++) {
    html += '<div class="col"><h2>' + courts[c] + 'コート</h2>';
    for (i = 0; i < ms.length; i++) if (ms[i].court === courts[c] || ms[i].two) html += cardHtml(ms[i], courts[c]);
    html += '</div>';
  }
  document.getElementById('board').innerHTML = html + '</div>';
}

/* ========== 操作 ========== */
function op(id, kind, state) {
  if (busy) return;
  busy = true;
  api({ action: 'adminCtlUpdate', matchId: id, op: kind, state: state }).then(function (d) {
    busy = false;
    apply(d);
  }).catch(function (err) {
    busy = false;
    toast(err.message, true);
  });
}

function undo(id) {
  var m = findMatch(id);
  if (!confirm('第' + m.no + '試合を「待機」に戻します（' + (m.state === '終了' ? '結果も消えます' : '開始時刻を消します') + '）。よろしいですか？')) return;
  op(id, 'state', '待機');
}

function findMatch(id) {
  var i;
  for (i = 0; i < DATA.matches.length; i++) if (DATA.matches[i].id === id) return DATA.matches[i];
  return null;
}

function openResult(id) {
  var m = findMatch(id);
  res = { id: id, winner: m.winner || '', score: '' };
  if (m.score && m.winner) {
    var sc = String(m.score).match(/^(\d+)\s*[-－]\s*(\d+)$/);
    res.score = sc ? (m.winner === 'L' ? sc[1] + '-' + sc[2] : sc[2] + '-' + sc[1]) : m.score;
  }
  modalOpen = true;
  renderModal();
  document.getElementById('overlay').className = 'overlay show';
}

function renderModal() {
  var m = findMatch(res.id);
  var isTeam = DATA.division.type === 'team';
  var quick = isTeam ? ['3-0', '2-1', '2-0'] : ['4-0', '4-1', '4-2', '4-3'];
  var h = '<h3>第' + m.no + '試合　' + esc(m.round) + '　結果入力</h3>';
  h += '<div class="muted" style="margin-bottom:6px">勝者を選んでください</div><div class="pick">';
  h += '<button class="' + (res.winner === 'L' ? 'on' : '') + '" onclick="setWin(\'L\')">' + esc(m.left.label) + '<small>' + esc(m.left.sub) + '</small></button>';
  h += '<button class="' + (res.winner === 'R' ? 'on' : '') + '" onclick="setWin(\'R\')">' + esc(m.right.label) + '<small>' + esc(m.right.sub) + '</small></button></div>';
  h += '<div class="muted" style="margin-bottom:6px">' + (isTeam ? '勝ちペア数（勝者－敗者）' : 'ゲームカウント（勝者－敗者）') + '</div><div class="quick">';
  var i;
  for (i = 0; i < quick.length; i++) h += '<button class="' + (res.score === quick[i] ? 'on' : '') + '" onclick="setScore(\'' + quick[i] + '\')">' + quick[i] + '</button>';
  h += '<button class="' + (res.score === '不戦勝' ? 'on' : '') + '" onclick="setScore(\'不戦勝\')">不戦勝</button></div>';
  h += '<input id="scoreInput" value="' + esc(res.score) + '" placeholder="例：' + quick[1] + '" oninput="res.score=this.value">';
  h += '<div class="mbtns"><button class="btn btn-out" onclick="closeModal()">やめる</button><button class="btn" onclick="saveResult()">結果を確定</button></div>';
  document.getElementById('modal').innerHTML = h;
}

function setWin(w) { res.winner = w; renderModal(); }
function setScore(s) { res.score = s; renderModal(); }

function closeModal() {
  modalOpen = false;
  document.getElementById('overlay').className = 'overlay';
}

function saveResult() {
  if (!res.winner) { toast('勝者を選んでください', true); return; }
  var s = String(res.score || '').trim();
  var sc = s.match(/^(\d+)\s*[-－]\s*(\d+)$/);
  if (sc && parseInt(sc[1], 10) < parseInt(sc[2], 10)) { toast('スコアは「勝者－敗者」の順で入力してください', true); return; }
  var stored = sc ? (res.winner === 'L' ? sc[1] + '-' + sc[2] : sc[2] + '-' + sc[1]) : s;
  busy = true;
  api({ action: 'adminCtlUpdate', matchId: res.id, op: 'result', winner: res.winner, score: stored }).then(function (d) {
    busy = false;
    closeModal();
    apply(d);
    toast('結果を確定しました');
  }).catch(function (err) {
    busy = false;
    toast(err.message, true);
  });
}

/* ========== 予選順位 ========== */
function renderRanks() {
  var panel = document.getElementById('rankPanel');
  if (!DATA.blocks) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  var bl = ['A', 'B', 'C', 'D'];
  var html = '';
  var i, j, p, rows, t, opts1, opts2;
  for (i = 0; i < bl.length; i++) {
    if (!DATA.blocks[bl[i]]) continue;
    rows = leagueTable(bl[i]);
    html += '<div class="rk"><h4>' + bl[i] + 'ブロック</h4><table>';
    opts1 = '<option value="">1位を選択</option>';
    opts2 = '<option value="">2位を選択</option>';
    for (j = 0; j < DATA.blocks[bl[i]].length; j++) {
      p = DATA.blocks[bl[i]][j];
      t = rows[p.id];
      html += '<tr><td>' + p.pos + '</td><td><strong>' + esc(p.label) + '</strong> <span class="muted">' + esc(p.sub) + '</span></td><td>' + t.w + '勝' + t.l + '敗</td><td>得失' + (t.gf - t.ga > 0 ? '+' : '') + (t.gf - t.ga) + '</td></tr>';
      opts1 += '<option value="' + esc(p.id) + '"' + (DATA.ranks[bl[i] + '1'] === p.id ? ' selected' : '') + '>' + esc(p.label) + '</option>';
      opts2 += '<option value="' + esc(p.id) + '"' + (DATA.ranks[bl[i] + '2'] === p.id ? ' selected' : '') + '>' + esc(p.label) + '</option>';
    }
    html += '</table><select id="r1_' + bl[i] + '">' + opts1 + '</select><select id="r2_' + bl[i] + '">' + opts2 + '</select>';
    html += '<button class="btn" style="width:100%" onclick="saveRank(\'' + bl[i] + '\')">' + bl[i] + 'ブロックの順位を確定</button></div>';
  }
  document.getElementById('ranks').innerHTML = html;
}

function leagueTable(blk) {
  var rows = {};
  var i, m, l, r, sc, a, b;
  for (i = 0; i < DATA.blocks[blk].length; i++) rows[DATA.blocks[blk][i].id] = { w: 0, l: 0, gf: 0, ga: 0 };
  for (i = 0; i < DATA.matches.length; i++) {
    m = DATA.matches[i];
    if (m.stage !== 'L' || m.state !== '終了' || m.round.charAt(0) !== blk) continue;
    l = rows[m.left.id];
    r = rows[m.right.id];
    if (!l || !r) continue;
    if (m.winner === 'L') { l.w++; r.l++; } else if (m.winner === 'R') { r.w++; l.l++; }
    sc = String(m.score || '').match(/(\d+)\s*[-－]\s*(\d+)/);
    if (sc) { a = parseInt(sc[1], 10); b = parseInt(sc[2], 10); l.gf += a; l.ga += b; r.gf += b; r.ga += a; }
  }
  return rows;
}

function saveRank(blk) {
  var first = document.getElementById('r1_' + blk).value;
  var second = document.getElementById('r2_' + blk).value;
  if (!first || !second) { toast('1位と2位を選んでください', true); return; }
  busy = true;
  api({ action: 'adminCtlRanks', block: blk, first: first, second: second }).then(function (d) {
    busy = false;
    apply(d);
    toast(blk + 'ブロックの順位を確定しました');
  }).catch(function (err) {
    busy = false;
    toast(err.message, true);
  });
}

function saveConfig() {
  busy = true;
  api({ action: 'adminCtlConfig', values: {
    start: document.getElementById('cStart').value, g5: document.getElementById('cG5').value, g7: document.getElementById('cG7').value,
    gapTeam: document.getElementById('cGapT').value, gapIndiv: document.getElementById('cGapI').value
  } }).then(function (d) {
    busy = false;
    document.activeElement.blur();
    apply(d);
    toast('目安時間を保存しました（終了見込み ' + d.finishPlan + '）');
  }).catch(function (err) {
    busy = false;
    toast(err.message, true);
  });
}

/* ========== 初期化 ========== */

  var html = '';
  var i;
  for (i = 0; i < DIVS.length; i++) html += '<a class="' + (DIVS[i][0] === divCode ? 'on' : '') + '" href="?div=' + DIVS[i][0] + '">' + DIVS[i][1] + '</a>';
  document.getElementById('divTabs').innerHTML = html;
  document.getElementById('pubLink').href = 'progress.html?div=' + divCode;
  try { pw = sessionStorage.getItem(PW_KEY) || ''; } catch (e) { pw = ''; }
  if (pw) load().catch(function () {});
  else document.getElementById('loginView').style.display = 'block';
  setInterval(function () { load().catch(function () {}); }, 20000);
})();
</script>
