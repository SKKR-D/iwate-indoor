<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<script src="gas-src.js"></script>
<script src="scenarios.js"></script>
<script src="engine.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大会プログラム｜第40回岩手県中学校インドアソフトテニス大会</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--deep:#123522;--main:#1a4a2e;--soft:#e8efe9;--line:#c9d6cc;--gold:#b8902a;--red:#c0392b;--muted:#5d6b62;--bg:#eef0ec}
html{font-size:15px;scroll-behavior:smooth;scroll-padding-top:110px}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:#111;line-height:1.6}
/* ---- 画面上部 ---- */
.bar{background:linear-gradient(135deg,var(--deep),var(--main));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.bar-in{max-width:900px;margin:0 auto;padding:8px 12px}
.bar-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar h1{font-size:.92rem;font-weight:900;line-height:1.3}
.bar h1 small{display:block;font-size:.64rem;font-weight:500;opacity:.85}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.ctrl button{padding:6px 11px;border-radius:16px;border:none;background:rgba(255,255,255,.16);color:#fff;font-family:inherit;font-size:.74rem;font-weight:700;cursor:pointer}
.ctrl button.on{background:#f3d36b;color:#3a2e00}
.toc{display:flex;gap:4px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:thin}
.toc a{flex:none;color:#fff;text-decoration:none;font-size:.72rem;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.1);white-space:nowrap}
.status{max-width:900px;margin:8px auto 0;padding:0 12px;font-size:.72rem;color:var(--muted)}
/* ---- ページ ---- */
.book{max-width:900px;margin:0 auto;padding:10px 10px 40px}
.pg{background:#fff;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:22px 22px;margin-bottom:16px;position:relative}
.pg h2{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:1px 8px;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:14px}
.pg h2::before{content:attr(data-en);flex-basis:100%;font-size:.6rem;font-weight:700;letter-spacing:.42em;color:var(--gold);line-height:1.5}
.pg h2::after{content:'';position:absolute;left:0;bottom:-2px;width:56px;height:3px;background:var(--gold)}
.pg h2 span{font-size:1.28rem;font-weight:900;color:var(--deep);letter-spacing:.06em;line-height:1.3}
.pg h2 small{font-size:.72rem;font-weight:500;color:var(--muted)}
.pg h2.hcap{display:none}
.pg h3{font-size:.98rem;font-weight:900;color:var(--deep);margin:14px 0 6px;border-left:4px solid var(--gold);padding-left:8px;line-height:1.35}
.pg p{font-size:.88rem}
.later{border:2px dashed var(--line);border-radius:10px;padding:40px 16px;text-align:center;color:var(--muted);font-size:.95rem}
body.locked .ctrl,body.locked .toc{display:none}
body.st-pre #mLive,body.st-pre #mBlank,body.st-after #mLive,body.st-after #mBlank{display:none}
.lockStaff{margin-top:18px;font-size:.85rem;color:var(--muted);text-align:center}
.lockStaff input{margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;width:12em}
.lockStaff button{padding:8px 14px;border:none;border-radius:8px;background:var(--main);color:#fff;font-weight:700;font-size:.95rem}
#lkMsg{color:var(--red);margin-top:6px}
.status a{color:inherit}
.cover{position:relative}
.cv-pdf{position:absolute;top:10px;right:12px;font-size:.78rem;font-weight:700;color:#fff;background:rgba(0,0,0,.25);padding:3px 9px;border-radius:12px;text-decoration:none;z-index:2}
.cover{padding:0;overflow:hidden}
.cv-hero{position:relative;container-type:inline-size;aspect-ratio:1144/1385;overflow:hidden;color:#fff;background:#0b1a2e}
.cv-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cv-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,14,30,.62) 0%,rgba(5,14,30,0) 20%,rgba(5,14,30,0) 56%,rgba(4,20,36,.5) 72%,rgba(3,12,26,.9) 100%)}
.cv-no{position:absolute;left:5cqw;top:3.6cqw;font-family:'Noto Serif JP',serif;font-weight:900;line-height:1;text-shadow:0 .3cqw 1.4cqw rgba(0,0,0,.6)}
.cv-no span{font-size:5.2cqw;vertical-align:.4em}
.cv-no b{font-size:16cqw;color:#f3d36b;margin:0 .4cqw;letter-spacing:-.02em}
.cv-lbl{position:absolute;right:5cqw;top:5cqw;text-align:right;text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.6)}
.cv-lbl small{display:block;font-size:2.1cqw;letter-spacing:.5em;font-weight:700;opacity:.9}
.cv-lbl b{display:inline-block;font-family:'Noto Serif JP',serif;font-weight:900;font-size:5.2cqw;letter-spacing:.12em;border-bottom:.5cqw solid #f3d36b;padding-bottom:.6cqw;margin-top:.8cqw}
.cv-who{position:absolute;right:0;top:27%;width:50cqw;padding:1.6cqw 5cqw 1.6cqw 0;background:linear-gradient(to left,rgba(5,14,30,.6),rgba(5,14,30,.35) 70%,rgba(5,14,30,0));text-align:right;font-size:max(2.25cqw,9px);line-height:1.6;text-shadow:0 0 .9cqw rgba(0,0,0,.9),0 0 .3cqw rgba(0,0,0,.9)}
.cv-who .k{font-size:max(1.7cqw,7px);letter-spacing:.4em;opacity:.85}
.cv-who .pn{font-family:'Noto Serif JP',serif;font-weight:900;font-size:5.6cqw;line-height:1.25;letter-spacing:.06em}
.cv-who .pn small{font-size:2.4cqw;margin-left:.6cqw;letter-spacing:0}
.cv-who .ach{display:inline-block;border:.3cqw solid #f3d36b;color:#f3d36b;font-weight:900;padding:.2cqw 1.4cqw;margin:.8cqw 0 .4cqw}
.cv-ttl{position:absolute;left:5cqw;right:5cqw;bottom:4.2cqw}
.cv-pre{font-size:4.6cqw;font-weight:900;letter-spacing:.14em;text-shadow:0 .3cqw 1cqw rgba(0,0,0,.7)}
.cv-main{font-weight:900;font-size:10.6cqw;line-height:1.12;letter-spacing:-.01em;margin-top:.6cqw;color:#fff;-webkit-text-stroke:.5cqw #0b3d2c;paint-order:stroke fill;text-shadow:.7cqw .7cqw 0 #19a974,0 0 2.4cqw rgba(0,0,0,.55)}
.cv-main .ac{color:#f3d36b}
.cv-script{position:absolute;right:0;bottom:23.5cqw;font-family:'Playfair Display','Times New Roman',serif;font-style:italic;font-weight:700;font-size:7cqw;color:#f3d36b;transform:rotate(-6deg);transform-origin:right bottom;text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.7);white-space:nowrap;opacity:.96}
.cv-sub{font-size:max(1.85cqw,8.5px);line-height:1.6;margin-top:1.8cqw;opacity:.92;text-shadow:0 0 .6cqw rgba(0,0,0,.9)}
.cv-info{padding:14px 20px 16px}
.cv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cv-box{border-left:3px solid var(--main);padding:1px 0 1px 10px}
.cv-box b{display:block;color:var(--main);font-size:.74rem}
.cv-box div{font-size:.9rem;font-weight:700;line-height:1.45}
.cv-box div small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.cv-foot{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.cv-org{font-size:.82rem;line-height:1.8}
.cv-org b{color:var(--main)}
.cv-qr{display:flex;gap:10px;align-items:center;font-size:.72rem;color:var(--muted);line-height:1.5}
.cv-qr #qr{width:84px;height:84px;flex:none}
.cv-qr #qr img,.cv-qr #qr canvas{width:84px!important;height:84px!important}
h2 small a{text-decoration:none;font-weight:700}
.pdftip{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.pdftip[hidden]{display:none}
.pdftip .box{background:#fff;border-radius:12px;padding:18px 18px 14px;max-width:420px;font-size:.9rem;line-height:1.7}
.pdftip p{margin:8px 0}
.pdftip p.s{font-size:.78rem;color:var(--muted)}
.pdftip .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.pdftip button{padding:8px 16px;border:none;border-radius:8px;background:var(--main);color:#fff;font-weight:700;font-size:.95rem}
.pdftip button.no{background:#e4e4e4;color:#333}
.wait{border:2px dashed var(--line);border-radius:10px;padding:30px 16px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th{background:var(--soft);color:var(--deep);font-size:.76rem;padding:5px 6px;border:1px solid var(--line);text-align:left;white-space:nowrap}
table.t td{padding:5px 6px;border:1px solid #d6ded8;vertical-align:top}
table.t td.c,table.t th.c{text-align:center}
table.t td.n{white-space:nowrap}
.chg{white-space:nowrap;display:inline-block;font-size:.62rem;font-weight:900;color:#fff;background:var(--red);border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.was{display:block;font-size:.68rem;color:var(--red)}
/* 表紙 */
/* 目次 */
.toc-list{columns:2;column-gap:24px;font-size:.88rem;margin-bottom:6px}
.toc-list a{display:flex;justify-content:space-between;border-bottom:1px dotted #bbb;color:#111;text-decoration:none;padding:3px 0;break-inside:avoid}
.toc-list a span:last-child{color:var(--muted);font-size:.78rem}
/* 要項 */
dl.yk{display:grid;grid-template-columns:2em 6.8em minmax(0,1fr);column-gap:.7em;font-size:.86rem;line-height:1.7}
dl.yk>div{display:contents}
dl.yk dt,dl.yk dd{padding:5px 0;border-top:1px solid #e3e9e4}
dl.yk>div:first-child>*{border-top:none}
dl.yk dt.no{font-weight:700;color:var(--main);text-align:right}
dl.yk dt.k{font-weight:700;color:var(--deep);text-align:justify;text-align-last:justify}
.yk-lead{font-size:.8rem;color:var(--muted);margin:-6px 0 8px;line-height:1.6}
.yk-day{font-weight:700;color:var(--main)}
.yk-tag{display:inline-block;font-size:.7rem;border:1px solid var(--gold);color:#7a5e14;padding:0 5px;border-radius:3px;margin-left:5px;line-height:1.55;vertical-align:1px}
.yk-sched{display:grid;grid-template-columns:auto auto auto auto;column-gap:1.2em;margin:2px 0 7px;font-size:.84rem;background:var(--soft);padding:4px 11px;border-radius:4px;width:max-content;max-width:100%}
.yk-sched span:nth-child(odd){color:var(--muted)}
.yk-sub{font-weight:700;color:var(--deep);margin-top:2px}
ol.ind{list-style:none}
ol.ind>li{padding-left:3em;text-indent:-3em}
ol.ind.n1>li{padding-left:1.6em;text-indent:-1.6em}
ol.ind ol.ind{margin-top:1px}
.yk-rec{display:grid;grid-template-columns:auto auto auto auto minmax(0,1fr);column-gap:.8em;margin:2px 0 2px 3em;font-size:.82rem;line-height:1.6}
.yk-rec b{color:var(--deep)}
.yk-ask{display:flex;flex-wrap:wrap;gap:2px 1.6em;background:var(--soft);border-radius:4px;padding:6px 12px}
.yk-ask b{color:var(--deep)}
/* 服装規定 */
.dr{font-size:.86rem;line-height:1.7}
.dr h3:first-child{margin-top:2px}
.dr .lead{margin:2px 0 3px}
.dr .supp{font-weight:700;color:var(--deep);margin:8px 0 2px}
.zk{display:flex;gap:18px;align-items:center;margin-top:10px;flex-wrap:wrap}
.zk-cap{font-weight:700;color:var(--deep);font-size:.8rem;margin-bottom:3px}
.zk-box{width:168px;height:116px;border:2px solid #222;display:grid;grid-template-rows:1fr 1.6fr 1fr;text-align:center;align-items:center;font-weight:700;background:#fff}
.zk-box div:nth-child(1),.zk-box div:nth-child(3){font-size:.95rem;letter-spacing:.5em;padding-left:.5em}
.zk-box div:nth-child(2){font-size:2rem;letter-spacing:.6em;padding-left:.6em;line-height:1}
.zk-rat{display:grid;grid-template-rows:1fr 1.6fr 1fr;height:116px;align-items:center;font-size:.8rem;color:#333}
.zk-rat b{color:var(--main);margin-right:.6em}
.zk-note{flex:1;min-width:200px;font-size:.78rem;color:#333;border-left:3px solid var(--line);padding-left:10px;line-height:1.7}
/* カウンターの見方 */
.ct-intro{background:var(--soft);border-radius:6px;padding:9px 14px;font-size:.86rem;line-height:1.75}
.ct-intro b{color:var(--deep)}
.ct-intro ol{margin:3px 0 0 1.4em}
.ct-ex{margin-top:16px}
.ct-ex .cap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ct-ex .cap b{display:inline-block;background:var(--main);color:#fff;font-size:.72rem;padding:1px 8px;border-radius:3px;letter-spacing:.1em}
.ct-ex .cap .call{font-size:1.05rem;font-weight:900;color:var(--deep)}
.ct-ex .cap small{color:var(--muted);font-size:.78rem}
.ct-ex svg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.ct-note{font-size:.8rem;color:#333;margin-top:12px}
/* 目次・メモ・裏表紙（印刷用） */
.print-only{display:none}
.tc-g{margin-top:12px}
.tc-g h4{font-size:.72rem;font-weight:700;color:var(--gold);letter-spacing:.2em;border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:2px}
.tc-r{display:flex;align-items:baseline;gap:8px;padding:5px 0 5px 2px;font-size:.95rem}
.tc-r .t{font-weight:700;color:var(--deep)}
.tc-r .t small{font-weight:500;color:var(--muted);font-size:.78rem;margin-left:.6em}
.tc-r .d{flex:1;border-bottom:1.5px dotted #b9c6bc;transform:translateY(-3px)}
.tc-r .n{font-weight:900;color:var(--main);min-width:1.6em;text-align:right}
.tc-foot{margin-top:18px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;line-height:1.8}
.memo-l{display:flex;flex-direction:column;height:560px}
.memo-l i{flex:1;border-bottom:1px solid #cdd6cf}
.memo-l i:nth-child(5n){border-bottom-color:#9fb3a5}
.back{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px}
.back svg{width:62%;max-width:400px;height:auto;display:block}
.back .org{margin-top:28px;font-size:1.25rem;font-weight:700;letter-spacing:.32em;padding-left:.32em;color:#111;text-align:center}
/* 注意 */
ol.notes{counter-reset:n;list-style:none;font-size:.86rem}
ol.notes>li{position:relative;padding:5px 0 5px 30px;border-bottom:1px dashed #e1e5e2}
ol.notes>li::before{counter-increment:n;content:counter(n);position:absolute;left:0;top:6px;width:21px;height:21px;border-radius:50%;background:var(--main);color:#fff;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center}
ol.notes b{color:var(--deep)}
ol.notes ul{margin:3px 0 0 1.1em}
ol.notes ol.sub{margin:3px 0 0 1.5em;list-style:decimal}
ol.notes ol.sub li{padding:1px 0}
.notes .callout{margin:6px 0 2px;border:2px solid #c0392b;border-radius:8px;background:#fff6f4;padding:6px 10px 6px 12px}
.notes .callout .ct{display:block;color:#a52a1a;font-weight:900;margin-bottom:2px}
.notes .callout ul{margin:0 0 0 1.1em;list-style:disc}
.notes .callout em{font-style:normal;font-weight:900;background:linear-gradient(transparent 60%,#ffd9cf 60%)}
/* 組合せ */
.br svg{display:block;width:100%;height:auto}
/* 進行表 */
.prog td.st{white-space:nowrap;font-size:.76rem}
.prog td.rs{font-weight:700;white-space:nowrap}
.prog tr.done td{color:#555}
.prog .win{font-weight:900}
.prog .sub{color:var(--muted);font-size:.72rem}
.prog td.ref{font-size:.74rem;color:#444}
.pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pch{font-weight:900;color:#fff;background:var(--main);padding:4px 10px;border-radius:6px 6px 0 0;font-size:.9rem}
table.prog2{width:100%;border-collapse:collapse;font-size:.8rem}
table.prog2 th{background:var(--soft);color:var(--deep);font-size:.7rem;padding:3px 5px;border:1px solid var(--line);text-align:left;white-space:nowrap}
table.prog2 td{padding:4px 5px;border:1px solid #d6ded8;vertical-align:top}
.prog2 td.no{white-space:nowrap;width:5.6em}
.prog2 td.no b{display:block;font-size:.82rem}
.prog2 td.no .st{display:block;font-size:.74rem;color:#444}
.prog2 td.vs .rd{display:block;font-size:.68rem;color:var(--muted)}
.prog2 td.vs div{line-height:1.45}
.prog2 td.rf{width:9.5em;font-size:.72rem;color:#444}
.prog2 td.rf .ref{display:block}
.prog2 td.rf .rs{display:block;font-size:.85rem;color:#111;margin-top:2px}
.prog2 tr.done td{color:#555}
.prog2 .win{font-weight:900}
.prog2 .sub{color:var(--muted);font-size:.68rem}
@media(max-width:700px){.pcols{grid-template-columns:1fr}}
.court{display:inline-block;min-width:20px;text-align:center;border-radius:5px;background:var(--main);color:#fff;font-weight:900;font-size:.72rem}
/* チーム名簿 */
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tm{border:1.2px solid var(--line);border-radius:6px;overflow:hidden;font-size:.78rem;break-inside:avoid}
.tm .h{background:var(--soft);padding:4px 6px;font-weight:900;color:var(--deep);display:flex;justify-content:space-between;gap:4px}
.tm .h small{font-weight:500;color:var(--muted);font-size:.66rem}
/* 組合せの番号の札（進行表と同じ形） */
.slot{display:inline-block;min-width:2.15em;padding:0 .25em;border:1.3px solid var(--deep);border-radius:3px;background:#fff;color:var(--deep);font-weight:900;text-align:center;line-height:1.4;letter-spacing:.02em;white-space:nowrap}
.tm .h .slot{margin-right:5px;font-size:.92em}
.tm ol{list-style:none}
.tm li{display:flex;justify-content:space-between;gap:4px;padding:1px 6px;border-top:1px solid #eef1ee}
.tm li span:first-child{color:var(--muted);width:1.3em;flex:none}
.tm li .nm{flex:1}
.tm li.v .nm{color:#aaa}
.tm li .chm{color:var(--red);font-weight:900;margin-left:2px}
.tm li.wl{border-top:none;color:var(--red);font-size:.68rem;padding-top:0;line-height:1.2}
.tm li.co{background:#f6f8f6;font-weight:700}
.tm li.co span:first-child{color:var(--main)}
/* 栄光の記録・役員 */
.ofg{margin-bottom:6px}
.ofg h3{margin-top:12px}
.ofr{display:flex;gap:14px;align-items:baseline;padding:5px 2px;border-bottom:1px solid var(--line)}
.ofr .role{flex:none;width:8.5em;text-align:justify;text-align-last:justify;font-weight:700;color:var(--main);font-size:.9rem}
.ofr .names{display:flex;flex-wrap:wrap;gap:2px 0;flex:1}
.ofr .nm{display:inline-block;min-width:7.2em;font-size:.95rem;white-space:nowrap;padding-right:.6em}
.ofr .nm small{display:block;font-size:.7rem;color:var(--muted)}
.foot{font-size:.74rem;color:var(--muted);margin-top:10px}
@media (max-width:640px){
  .pg{padding:16px 12px}
  .scroll table.t{min-width:600px}
  .prog td.vs,.prog td.ref,.prog td.n{white-space:nowrap}
  .ofr .role{width:7em;font-size:.82rem}
  .ofr .nm{min-width:6.4em;font-size:.9rem}
  .teams{grid-template-columns:repeat(2,1fr)}
  .cv-grid{grid-template-columns:repeat(2,1fr)}
  .toc-list{columns:1}
  dl.yk{grid-template-columns:1.8em minmax(0,1fr)}
  dl.yk dt.k{text-align:left;text-align-last:auto}
  dl.yk dd{grid-column:1/-1;padding:0 0 7px 1.8em;border-top:none}
  .yk-sched{grid-template-columns:auto auto;width:auto}
  .yk-rec{grid-template-columns:auto auto minmax(0,1fr);margin-left:0}
  .yk-rec span:nth-child(5n+4){grid-column:2}
  .back .org{font-size:1rem;letter-spacing:.18em;padding-left:.18em}
}
/* ---- 印刷：1ページ＝A4 1枚 ---- */
@media print{

  /* 選手変更一覧は冊子に入れない（非公開。１ページだけのPDFでは出せる） */
  body:not(.print-one) .pg[data-grp="changes"]{display:none}
  /* 白紙（冊子）のときの進行表：結果が入らないので行を高くして書き込みやすくする */
  .blank-mode .pcols.roomy table.prog2{font-size:10pt}
  .blank-mode .pcols.roomy table.prog2 td{padding:7.2mm 2.2mm}
  .blank-mode .pcols:not(.roomy) table.prog2 td{padding:3.6px 3px}
  .scr-only{display:none}
  .back-pg{height:277mm;display:flex;align-items:center;justify-content:center}
  .back{min-height:0;margin-top:-10mm}
  .back svg{width:100mm;max-width:none}
  .back .org{font-size:15pt;margin-top:15mm}
  body{background:#fff}
  .bar,.status,.pdftip,.cv-pdf,h2 small a{display:none}
  .cover{height:277mm;display:flex;flex-direction:column}
  .cover,.cover *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cv-hero{flex:none}
  .cv-info{flex:1;padding:5mm 1mm 0;display:flex;flex-direction:column;justify-content:space-between}
  .cv-box div{font-size:10pt}
  .cv-qr #qr,.cv-qr #qr img,.cv-qr #qr canvas{width:22mm!important;height:22mm!important}
  body.print-one .pg:not(.pt){display:none}
  body.print-one .pg.pt1{break-before:auto;page-break-before:auto}
  .book{max-width:none;padding:0;margin:0}
  .pg{box-shadow:none;border-radius:0;margin:0;padding:0;break-before:page;page-break-before:always;min-height:0}
  .pg:first-child{break-before:auto;page-break-before:auto}
  .br svg{max-height:250mm;width:auto;max-width:100%;margin:0 auto}
  table.t{font-size:8.6pt}
  #notes ol.notes{font-size:8.5pt;line-height:1.33}
  #notes ol.notes>li{padding:1.5px 0 1.5px 26px}
  #notes .callout{margin:3px 0 1px;padding:3px 8px 3px 10px;border-width:1.5px}

  #history .hteam table.ht td{height:var(--rh,8mm);padding-top:0;padding-bottom:0}
  #history .scroll table.t{min-width:0}

  .tm{font-size:8pt}

  .pch{font-size:9pt;padding:1.2mm 3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.prog2{font-size:7.6pt}
  table.prog2 th{font-size:7pt;padding:1px 3px}

  .pcols.roomy table.prog2{font-size:9pt}
  .pcols.roomy table.prog2 td{padding:2.6mm 2mm;line-height:1.4}

  .pcols.roomy .prog2 td.no .st,.pcols.roomy .prog2 td.rf{font-size:8pt}
  .pcols.roomy .prog2 td.vs .rd{font-size:7.4pt}
  .pcols.roomy .prog2 td.rf .rs{font-size:9.5pt}
  table.prog th,table.prog td{padding:1.5px 4px;line-height:1.35}
  table.prog td.vs,table.prog td.ref{white-space:nowrap}
  table.prog td.vs div{display:inline}
  table.prog td.vs div+div::before{content:'　－　';color:#888}
  .prog .sub{font-size:6.8pt}
  a{color:inherit;text-decoration:none}
  .scroll{overflow:visible}
}
</style>

<body>
<div class="bar"><div class="bar-in">
  <div class="bar-top">
    <h1><small id="hdSub">第40回岩手県中学校インドアソフトテニス大会</small>大会プログラム</h1>
    <div class="ctrl">
      <button id="mLive" onclick="setMode(false)">結果入り</button>
      <button id="mBlank" onclick="setMode(true)">白紙（記入用）</button>
      <button onclick="pdfAll()">📥 全ページPDF</button>
    </div>
  </div>
  <nav class="toc" id="toc"></nav>
</div></div>
<div class="status" id="status"></div>
<div class="pdftip" id="pdfTip" hidden><div class="box">
  <b><span class="pt-what">全ページ</span>をPDFにします</b>
  <p>このあと出る印刷の画面で、送信先（プリンター）を<b>「PDFに保存」</b>にして保存してください。</p>
  <p class="s">iPhone：共有ボタン →「プリント」→ 右上の共有ボタン →「"ファイル"に保存」<br>Android：︙ →「共有」→「印刷」→「PDF形式で保存」</p>
  <div class="bt"><button onclick="doPrint()">PDFにする</button><button class="no" onclick="closePdfTip()">やめる</button></div>
</div></div>
<main class="book" id="book"><div class="pg"><div class="wait">読み込み中...</div></div></main>

<script src="preview.js"></script>
<script src="bracket-core.js"></script>
<style id="pageCss"></style>
<script>
var BR_CROP = 72;   /* 組合せの図の上の大会名・期日・場所は描かない（ページの見出しに出す） */
/* ===== 設定 ===== */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxYHQcJ6BqAOKWWa_n1368nOitIVPfNC3SOPYk58-Lm3UtCPIT6slKdcVz0C9SvpCJJ/exec';
/* ================ */
var params = new URLSearchParams(location.search);
var BLANK_MODE = params.get('mode') === 'blank';
var P = null, DIV = {};
var CODES = ['MI', 'WI', 'MT', 'WT'];
var NAME = { MI: '男子個人戦', WI: '女子個人戦', MT: '男子団体戦', WT: '女子団体戦' };

function getJson(q, pv) { return pvFetch(q, pv); }

/* 役員・係員のパスワードがあれば、いつでもその時点の全ページ（選手変更一覧も）を見られる */
var PROG_KEY = 'iwateIndoorProgramPw';
var STAGE = 'staff';   /* pre＝組合せ公開〜大会前／full＝大会の2日間／after＝大会後／staff＝役員・係員 */
function staffPw() {
  try {
    return localStorage.getItem(PROG_KEY) || localStorage.getItem('iwateIndoorStaffPw') || localStorage.getItem('iwateIndoorCtlPw') || localStorage.getItem('recPw') || '';
  } catch (e) { return ''; }
}
function postJson(body) {
  return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
    .then(function (r) { return r.text(); }).then(function (t) { return JSON.parse(t); });
}
function loadProgram() {
  if (PREVIEW) return getJson('action=programData', { action: 'adminPreviewProgram' });
  var pw = staffPw();
  if (!pw) return getJson('action=programData', {});
  return postJson({ action: 'programStaff', pw: pw }).then(function (d) {
    if (d.status === 'ok') return d;
    try { if (localStorage.getItem(PROG_KEY) === pw) localStorage.removeItem(PROG_KEY); } catch (e) {}
    return getJson('action=programData', {});
  });
}

function load() {
  return loadProgram().then(function (prog) {
    if (prog.locked) { P = null; renderLocked(prog); return; }
    var jobs = [];
    var i;
    for (i = 0; i < CODES.length; i++) jobs.push(getJson('action=progress&div=' + CODES[i], { action: 'adminPreview', div: CODES[i] }));
    return Promise.all(jobs).then(function (rs) {
      P = prog;
      setStage(prog.stage || 'staff');
      for (i = 0; i < CODES.length; i++) { rs[i].division.code = CODES[i]; DIV[CODES[i]] = rs[i]; }
      render();
    });
  }).catch(function (err) {
    document.getElementById('status').textContent = '読み込めませんでした（' + err.message + '）。自動で再試行します。';
  });
}

function setStage(st) {
  STAGE = st;
  document.body.className = document.body.className.replace(/\bst-\w+/g, '').trim() + ' st-' + st;
  if (st === 'pre' || st === 'after') BLANK_MODE = false;
  renderToc();
}

function loginBox(lead) {
  return '<div class="lockStaff">' + lead + '<br>' +
    '<input id="lkPw" type="password" autocomplete="current-password" placeholder="パスワード">' +
    ' <button onclick="staffLogin()">表示</button><div id="lkMsg"></div></div>';
}

/* 組合せの公開前：お知らせと、役員・係員用のパスワード欄だけ出す */
function renderLocked(d) {
  document.body.classList.add('locked');
  if (d.tournament) document.getElementById('hdSub').textContent = d.tournament;
  document.getElementById('book').innerHTML = '<div class="pg"><div class="wait" style="line-height:1.9">' +
    '大会プログラムは、<b>組合せの公開（11月24日予定）</b>とともに一部を公開します。<br>全ページの公開は <b>' + esc(d.from) + '〜' + esc(d.to) + '</b> です。</div>' +
    loginBox('役員・係員の方は、パスワードを入れるといつでも全ページを見られます。') + '</div>';
  document.getElementById('status').textContent = '';
  bindLogin();
}

/* 公開中のページから役員・係員としてログインする */
function showLogin() {
  if (document.getElementById('lkPw')) return;
  var box = document.createElement('div');
  box.className = 'pg';
  box.innerHTML = loginBox('役員・係員のパスワードを入れると、その時点の全ページ（選手変更一覧も）を見られます。');
  var book = document.getElementById('book');
  book.insertBefore(box, book.firstChild);
  window.scrollTo(0, 0);
  bindLogin();
}
function bindLogin() {
  var box = document.getElementById('lkPw');
  if (box) { box.addEventListener('keydown', function (e) { if (e.key === 'Enter') staffLogin(); }); box.focus(); }
}

function staffLogin() {
  var pw = (document.getElementById('lkPw') || {}).value || '';
  if (!pw) return;
  document.getElementById('lkMsg').textContent = '確認しています...';
  postJson({ action: 'programStaff', pw: pw }).then(function (d) {
    if (d.status !== 'ok') { document.getElementById('lkMsg').textContent = d.message || 'パスワードが違います。'; return; }
    try { localStorage.setItem(PROG_KEY, pw); } catch (e) {}
    load();
  }).catch(function (e) { document.getElementById('lkMsg').textContent = '通信できませんでした（' + e.message + '）'; });
}

function dataFor(code) {
  var d = DIV[code];
  return BLANK_MODE ? blankOut(JSON.parse(JSON.stringify(d))) : d;
}

/* ============================================================
   各ページ
   ============================================================ */
var TITLES = {
  cover: '表紙', officials: '大会役員・競技役員', youkou: '大会要項', dress: '服装規定', counter: 'カウンターの見方', notes: '競技上の注意',
  'br-MI': '男子個人戦 組合せ', 'br-WI': '女子個人戦 組合せ', 'pr-MI': '男子個人戦 進行表', 'pr-WI': '女子個人戦 進行表',
  'br-MT': '男子団体戦 組合せ', 'br-WT': '女子団体戦 組合せ', 'pr-MT': '男子団体戦 進行表', 'pr-WT': '女子団体戦 進行表',
  pairs: '個人戦 選手名簿', 'tm-MT': '男子団体戦 選手名簿', 'tm-WT': '女子団体戦 選手名簿', changes: '選手変更一覧', history: '栄光の記録',
  toc: '目次', memo: 'メモ', back: '裏表紙'
};
var GAME_I = ['br-MI', 'pr-MI', 'br-WI', 'pr-WI'];
var GAME_T = ['br-MT', 'pr-MT', 'br-WT', 'pr-WT'];
var INFO = ['youkou', 'notes', 'dress', 'counter'];
/* 公開の段階ごとに出すページ（この順で並ぶ）。目次・メモは印刷したときだけ出る。
   冊子は24ページ（中綴じ）：表紙・目次（番号なし）、１ 役員、２〜３ 要項、４ 競技上の注意、５ 服装規定、６ カウンター、
   ７ 個人戦選手名簿、８〜11 個人戦（男子 組合せ・進行表、女子 組合せ・進行表）、12〜13 団体戦選手名簿（男子・女子）、
   14〜17 団体戦（男子 組合せ・進行表、女子 組合せ・進行表）、18〜20 栄光の記録、21 メモ、裏表紙（番号なし） */
var ORDER = {
  pre: ['cover', 'toc'].concat(INFO, GAME_I, GAME_T, ['history', 'memo', 'back']),
  full: ['cover', 'toc', 'officials'].concat(INFO, ['pairs'], GAME_I, ['tm-MT', 'tm-WT'], GAME_T, ['history', 'memo', 'back']),
  after: ['br-MI', 'br-WI', 'br-MT', 'br-WT', 'history', 'back'],
  staff: ['cover', 'toc', 'officials'].concat(INFO, ['pairs'], GAME_I, ['tm-MT', 'tm-WT'], GAME_T, ['changes', 'history', 'memo', 'back'])
};
/* 白紙（記入用）では選手変更一覧を出さない（非公開。冊子の事前印刷は白紙で行う） */
function sectionsNow() {
  var l = ORDER[STAGE] || ORDER.staff;
  return BLANK_MODE ? l.filter(function (x) { return x !== 'changes'; }) : l;
}
function titleOf(id) {
  if (STAGE === 'after' && id.indexOf('br-') === 0) return NAME[id.slice(3)] + ' 結果';
  return TITLES[id];
}

/* PDF で配る資料（PDF を画像にしたページを並べる）。pages が空なら「後日掲載」 */
var DOCS = {
  youkou: { pdf: '../youkou.pdf', pages: ['../doc/youkou-1.png', '../doc/youkou-2.png'] },
  dress: { pdf: '../doc/fukusou.pdf', pages: ['../doc/fukusou-1.png'] },
  counter: { pdf: '../doc/counter.pdf', pages: ['../doc/counter-1.png'] }
};

function pg(id, title, body, sub) {
  return '<section class="pg" id="' + id + '" data-grp="' + id + '">' + (title ? '<h2 data-en="' + enOf(id) + '"><span>' + title + '</span>' + (sub ? '<small>' + sub + '</small>' : '') + '</h2>' : '') + body + '</section>';
}

/* ---- 見出しの英字（冊子の章見出しの上に小さく出す） ---- */
var EN = { toc: 'CONTENTS', officials: 'OFFICIALS', youkou: 'TOURNAMENT OUTLINE', dress: 'DRESS CODE', counter: 'SCORE COUNTER', notes: 'RULES AND NOTES',
  br: 'DRAW', pr: 'ORDER OF PLAY', pairs: 'PLAYERS', tm: 'TEAM ROSTER', changes: 'CHANGES', history: 'HALL OF FAME', memo: 'MEMO' };
function enOf(id) { return EN[id] || EN[id.slice(0, 2)] || ''; }

/* ---- 大会要項（２ページ） ---- */
function youkouPages() {
  var pdf = '<a href="' + DOCS.youkou.pdf + '" target="_blank" download>📄 PDF</a>';
  var row = function (no, k, v) { return '<div><dt class="no">' + no + '</dt><dt class="k">' + k + '</dt><dd>' + v + '</dd></div>'; };
  /* 式の名前：個人戦の日は「開会式」「個人戦表彰式」、団体戦の日は「団体戦開始式」「閉会式（団体戦表彰式）」 */
  var sched = function (a, open, close) {
    return '<div class="yk-sched"><span>開場</span><span>７:30</span><span>受付</span><span>７:35〜８:00</span>' +
      '<span>練習</span><span>' + a + '</span><span>監督会議</span><span>８:25</span>' +
      '<span>' + open + '</span><span>８:45〜</span><span>競技開始</span><span>９:00〜</span>' +
      '<span>' + close + '</span><span>競技終了後</span><span>終了（予定）</span><span>17:00</span></div>';
  };
  var p1 = '<div class="yk-lead">兼 第38回都道府県対抗全日本中学生ソフトテニス大会 岩手県代表選手二次選考会<br>兼 第35回東北中学校ソフトテニスインドア大会 予選会</div><dl class="yk">' +
    row('１', '主催', '岩手県中学生ソフトテニス連盟') +
    row('２', '協賛', 'ナガセケンコー株式会社　ヨネックス株式会社') +
    row('３', '期日', '<span class="yk-day">令和８年11月28日（土）</span>　男女個人戦<span class="yk-tag">都道府県対抗選手二次選考会を兼ねる</span><br>' +
      '<span class="yk-day">令和８年11月29日（日）</span>　男女団体戦<span class="yk-tag">東北インドア予選会を兼ねる</span>') +
    row('４', '会場', '<span class="yk-day">男子</span>　雫石町営体育館（２面）<br>　　　〒020-0543　岩手郡雫石町高前田104　TEL 019-692-5030<br>' +
      '<span class="yk-day">女子</span>　紫波町総合体育館（２面）<br>　　　〒028-3307　紫波郡紫波町桜町字下川原100　TEL 019-676-2650') +
    row('５', '日程', '両会場とも同じ日程とする。<div class="yk-sub">11月28日（土）男女個人戦</div>' + sched('７:45〜８:30（15分×３ローテ）', '開会式', '個人戦表彰式') +
      '<div class="yk-sub">11月29日（日）男女団体戦</div>' + sched('７:45〜８:25（５分×８ローテ）', '団体戦開始式', '閉会式（団体戦表彰式）')) +
    row('６', '参加資格', '参加者は、以下に示す参加資格を得た個人及びチームであること。' +

/* 印刷したときのページ番号：表紙・目次・裏表紙は番号なしで、その次のページが１。１つの .pg が１ページ（栄光の記録は .hpg ごとに１ページ） */

  var secs = document.querySelectorAll('#book .pg');

  var i, id, n;
  for (i = 0; i < secs.length; i++) {
    id = secs[i].getAttribute('data-grp');

}

      L = String(titleOf(id) || '').replace(/["\\]/g, '');

function sideText(s, m, which) {
  if (!s || !s.decided) return '<span class="sub">' + esc(s ? s.label : '') + '</span>';
  var win = !BLANK_MODE && m.state === '終了' && m.winner === which;
  return '<span class="' + (win ? 'win' : '') + '">' + (win ? '○' : '') + esc(s.label) + '</span>' + (s.changed && !BLANK_MODE ? '<span class="chg">変更</span>' : '') + (s.sub ? ' <span class="sub">' + esc(s.sub) + '</span>' : '');
}

function progressPage(code) {
  var d = dataFor(code);
  if (!d.matches.length) return pg('pr-' + code, '進行表　' + NAME[code], '<div class="wait">進行表は、組合せと同じく11月24日（火）に掲載します。</div>');
  /* Aコートと Bコートを左右2列に並べる（スマートフォンでは上下）。2面展開の試合は両方の列に出す */
  var ms = d.matches.slice().sort(function (a, b) { return a.seq - b.seq; });
  var cols = { A: [], B: [] };
  var i, m;
  for (i = 0; i < ms.length; i++) {
    m = ms[i];
    if (m.note === '不戦勝') continue;
    if (m.two) { cols.A.push(m); cols.B.push(m); } else (cols[m.court] || cols.A).push(m);
  }
  var row = function (m) {
    var res = '';
    if (!BLANK_MODE) {
      if (m.state === '終了') res = esc(m.score || '');
      else if (m.state === '試合中') res = '<span style="color:var(--red)">試合中</span>';
      else if (m.state === '呼出') res = '<span style="color:#7a5d00">呼出中</span>';
    }
    return '<tr class="' + (!BLANK_MODE && m.state === '終了' ? 'done' : '') + '">' +
      '<td class="no"><b>' + (m.no ? '第' + m.no + '試合' : '') + '</b><span class="st">' + esc(BLANK_MODE ? (m.plan || '') : (m.start || m.plan || '')) + '</span></td>' +
      '<td class="vs"><span class="rd">' + esc(m.round) + (m.two ? '（2面展開）' : '') + '</span><div>' + sideText(m.left, m, 'L') + '</div><div>' + sideText(m.right, m, 'R') + '</div></td>' +
      '<td class="rf"><span class="ref">' + (m.referee ? esc(m.referee.label) + (m.referee.sub ? ' <span class="sub">' + esc(m.referee.sub) + '</span>' : '') : '') + '</span>' +
      (res ? '<b class="rs">' + res + '</b>' : '') + '</td></tr>';
  };
  var roomy = Math.max(cols.A.length, cols.B.length) <= 10;
  var h = '<div class="pcols' + (roomy ? ' roomy' : '') + '">';
  var c;
  for (c = 0; c < 2; c++) {
    var key = c ? 'B' : 'A';
    h += '<div class="pcol"><div class="pch">' + key + 'コート</div><table class="t prog2"><thead><tr><th>試合・予定</th><th>回戦・対戦</th><th>審判・結果</th></tr></thead><tbody>';
    for (i = 0; i < cols[key].length; i++) h += row(cols[key][i]);
    h += '</tbody></table></div>';
  }
  h += '</div><p class="foot">' + esc(d.date) + '　' + esc(d.venue) + '　予定時刻は目安です。当日の最新の時刻・コートは会場掲示の進行表（二次元コード）で確認してください。</p>';
  return pg('pr-' + code, '進行表　' + NAME[code], h, BLANK_MODE ? '' : '終了 ' + d.matches.filter(function (x) { return x.state === '終了' && x.note !== '不戦勝'; }).length + '試合');
}

/* 中体連の地区順（組合せ前のチーム名簿の並び） */

function teamsPage(code) {
  var list = (P.teams[code] || []).slice().sort(function (a, b) { return slotKey(a.slot) < slotKey(b.slot) ? -1 : slotKey(a.slot) > slotKey(b.slot) ? 1 : (dOrd(a.district) - dOrd(b.district) || String(a.name).localeCompare(String(b.name), 'ja')); });
  if (!list.length) return pg('tm-' + code, NAME[code] + ' 選手名簿', '<div class="wait">出場チームは後日掲載します。</div>');
  var h = '<div class="teams">';
  var i, j, t, p;
  for (i = 0; i < list.length; i++) {
    t = list[i];
    h += '<div class="tm"><div class="h"><span>' + (t.slot ? '<span class="slot">' + esc(t.slot) + '</span>' : '') + esc(t.name) + '</span><small>' + esc(t.district) + '</small></div><ol>';
    if (t.applied) h += '<li class="co"><span>監</span><span class="nm">' + esc(t.coach || '') + '</span><span></span></li>';
    if (!t.applied) h += '<li class="v"><span></span><span class="nm">（申込前）</span></li>';
    else for (j = 0; j < t.players.length; j++) {
      p = t.players[j];
      h += '<li class="' + (p.vacant ? 'v' : '') + '"><span>' + p.no + '</span><span class="nm">' + (p.vacant ? '―' : esc(p.name)) +
        (!BLANK_MODE && p.changedFrom ? '<span class="chm">※</span>' : '') + '</span><span>' + esc(p.vacant ? '' : p.grade) + '</span></li>' +
        (!BLANK_MODE && p.changedFrom ? '<li class="wl"><span></span><span class="nm">※変更前：' + esc(p.changedFrom) + '</span></li>' : '');
    }
    h += '</ol></div>';
  }
  h += '</div><p class="foot">左上の四角の数字は組合せ番号（進行表と同じ番号）、「監」は監督（ベンチ入り指導者）です。</p>';
  return pg('tm-' + code, NAME[code] + ' 選手名簿', h, list.length + 'チーム');
}

function changesPage() {
  var rows = BLANK_MODE ? [] : (P.changes || []);
  var h = '';
  if (!rows.length) h = '<div class="wait">' + (BLANK_MODE ? '大会当日の選手変更は、会場掲示と二次元コードの「選手変更一覧」でお知らせします。'
    : P.changesLocked ? '選手変更一覧は、大会当日に会場で掲示します（会場の二次元コードからも見られます）。' : '現在、選手変更はありません。') + '</div>';
  else {
    h = '<div class="scroll"><table class="t"><thead><tr><th>時刻</th><th>区分</th><th>チーム</th><th>対象</th><th>変更前</th><th>変更後</th></tr></thead><tbody>';
    var i, c;
    for (i = 0; i < rows.length; i++) {
      c = rows[i];
      h += '<tr><td class="n">' + esc(String(c.at).replace('-', '/')) + '</td><td class="n">' + esc(c.div) + '</td><td>' + esc(c.team) + '</td><td>' + esc(c.target) + (c.note ? '<br><span class="sub" style="color:#7a4b00;font-weight:700">' + esc(c.note) + '</span>' : '') + '</td>' +
        (c.coach ? '<td colspan="2">' + esc(c.to) + '</td>' : '<td style="color:#666">' + esc(c.from) + '</td><td style="color:var(--red);font-weight:900">' + esc(c.to) + '</td>') + '</tr>';
    }
    h += '</tbody></table></div>';
  }
  h += '<p class="foot">競技委員長が許可した変更を載せています。</p>';
  return pg('changes', '選手変更一覧', h);
}

/* 回 → 年度の表記（第1・2回＝昭和、第3〜32回＝平成、第33回〜＝令和。1桁は全角） */
function histYear_(n) {
  var z = function (v) { return v < 10 ? String.fromCharCode(0xFF10 + v) : String(v); };
  return n <= 2 ? 'S' + (n + 61) : n <= 32 ? 'H' + z(n - 2) : 'R' + z(n - 32);
}

function historyPage() {
  var rows = (P.history || []).slice();
  if (!rows.length) return pg('history', '栄光の記録', '<div class="later">後日掲載します</div>');
  var kinds = [], by = {};
  var i, k;
  for (i = 0; i < rows.length; i++) {
    k = rows[i]['種別'] || '';
    if (!by[k]) { by[k] = []; kinds.push(k); }
    by[k].push(rows[i]);
  }
  /* 今大会の回は、シートに行がなくても空欄の行を出す（結果はあとでシートに入れる） */
  var m = /第\s*(\d+)\s*回/.exec((P.info && P.info.tournament) || '');
  var cur = m ? parseInt(m[1], 10) : 0;
  var j;
  if (cur) {
    for (i = 0; i < kinds.length; i++) {
      var has = false;
      for (j = 0; j < by[kinds[i]].length; j++) if (histNo_(by[kinds[i]][j]['回']) === cur) has = true;
      if (!has) by[kinds[i]].push({ '回': String(cur), '年度': histYear_(cur), '種別': kinds[i] });
    }
  }
  /* 印刷：個人戦は種別ごとに1ページ、団体戦は男女を左右に並べて1ページ。どのページにも「栄光の記録」 */
  var cap = '<h2 class="hcap" data-en="' + EN.history + '"><span>栄光の記録</span></h2>';
  var indiv = '', team = '';
  for (i = 0; i < kinds.length; i++) {
    var list = by[kinds[i]].sort(function (a, b) { return histNo_(a['回']) - histNo_(b['回']); });  /* 上が古い回 */
    var isTeam = kinds[i].indexOf('団体') >= 0;
    /* 印刷の行の高さ：行が増えても１ページに収まるように、行数で割って決める（団体戦は下に注記が入る分を空ける） */
    var rh = Math.min(isTeam ? 8 : 6.2, Math.floor((isTeam ? 222 : 236) / Math.max(1, list.length) * 10) / 10);
    var t = '<div class="hk ' + (isTeam ? 'hk-t' : 'hk-i') + '"><h3>' + esc(kinds[i]) + '</h3><div class="scroll"><table class="t ht" style="--rh:' + rh + 'mm"><thead><tr><th class="c">回</th><th class="c">年度</th><th>優勝</th><th>準優勝</th><th>3位</th><th>3位</th></tr></thead><tbody>';
    var r;
    for (j = 0; j < list.length; j++) {
      r = list[j];
      t += '<tr><td class="c n">' + esc(r['回']) + '</td><td class="c n">' + esc(r['年度']) + '</td><td>' + esc(r['優勝'] || '') + '</td><td>' + esc(r['準優勝'] || '') + '</td><td>' + esc(r['3位'] || '') + '</td><td>' + esc(r['3位（2）'] || '') + '</td></tr>';
    }
    t += '</tbody></table></div></div>';
    if (isTeam) team += t; else indiv += '<div class="hpg">' + cap + t + '</div>';
  }
  var note = '<p class="foot">過去の大会の記録を掲載しています。掲載について申し出がある場合は、岩手県中学生ソフトテニス連盟までご連絡ください。</p>';
  var h = indiv + (team ? '<div class="hpg">' + cap + '<div class="hteam">' + team + '</div>' + note + '</div>' : note);
  return pg('history', '栄光の記録', h);
}
/* 回の並べ替え用（全角数字の「１」なども数として扱う） */
function histNo_(v) {
  var t = String(v == null ? '' : v).replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  return parseInt(t, 10) || 0;
}

/* ============================================================ */
function makeSection(id) {
  var c = id.slice(3);
  if (id === 'cover') return coverPage();
  if (id === 'officials') return officialsPage();
  if (id === 'toc') return tocPage();
  if (id === 'youkou') return youkouPages();
  if (id === 'dress') return dressPage();
  if (id === 'counter') return counterPage();
  if (id === 'memo') return memoPage();
  if (id === 'back') return backPage();
  if (id === 'notes') return notesPage();
  if (id === 'pairs') return pairsPage();
  if (id === 'changes') return changesPage();
  if (id === 'history') return historyPage();
  if (id.indexOf('br-') === 0) return bracketPage(c);
  if (id.indexOf('pr-') === 0) return progressPage(c);
  if (id.indexOf('tm-') === 0) return teamsPage(c);
  return '';
}

function render() {
  document.body.classList.remove('locked');
  var y = window.scrollY;
  document.getElementById('hdSub').textContent = P.info.tournament;
  var list = sectionsNow();
  var h = '';
  var i;
  for (i = 0; i < list.length; i++) h += makeSection(list[i]);
  document.getElementById('book').innerHTML = h;
  document.body.classList.toggle('blank-mode', !!BLANK_MODE);
  fillToc();
  pageCss(false);
  window.scrollTo(0, y);
  var qr = document.getElementById('qr');
  var url = (P.info.site || location.href.replace(/[^\/]*$/, '')) + 'program.html';
  if (qr && typeof QRCode === 'function') new QRCode(qr, { text: url, width: 192, height: 192, correctLevel: QRCode.CorrectLevel.M });
  var now = new Date();
  var t = now.getHours() + ':' + ('0' + now.getMinutes()).slice(-2) + ' 時点。';
  var msg = STAGE === 'pre' ? '大会前の公開です（大会役員・選手名簿は ' + (P.from || '大会当日') + ' から）。'
    : STAGE === 'after' ? '大会は終了しました。結果と栄光の記録を載せています。'
    : (BLANK_MODE ? '白紙（記入用）の表示です。結果・選手変更は入りません。' : '結果入りの表示です（1分ごとに自動更新）。');
  document.getElementById('status').innerHTML = esc(msg + '　' + t + '「📥 全ページPDF」で、今の表示のまま全ページを1つのPDFにできます。') +
    (STAGE === 'staff' ? '　<b>役員・係員の表示</b>' : '　<a href="#" onclick="showLogin();return false">役員・係員の方</a>');
}

function renderToc() {
  var h = '';
  var list = sectionsNow();
  var i;
  for (i = 0; i < list.length; i++) if (['cover', 'toc', 'memo', 'back'].indexOf(list[i]) < 0) h += '<a href="#' + list[i] + '">' + titleOf(list[i]) + '</a>';
  document.getElementById('toc').innerHTML = h;
}

function setMode(blank) {
  BLANK_MODE = blank;
  document.getElementById('mLive').className = blank ? '' : 'on';
  document.getElementById('mBlank').className = blank ? 'on' : '';
  try { history.replaceState(null, '', (blank ? '?mode=blank' : location.pathname) + (PREVIEW ? (blank ? '&' : '?') + 'preview=1' : '')); } catch (e) {}
  if (P) { renderToc(); render(); }
}

setMode(BLANK_MODE);
load();
setInterval(function () { if (!BLANK_MODE && document.visibilityState === 'visible' && !document.getElementById('lkPw')) load(); }, 60000);
</script>
