<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>運営スタッフ向け 当日の動き（動画）｜県インドア大会</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--main:#0a2f6b;--c:#1b5cc4;--cs:#e2ecfb;--acc:#e8601a;--gray:#eef3fa;--text:#222;--light:#666;--radius:12px}
html{font-size:15px}
body{font-family:'Noto Sans JP',sans-serif;background:var(--gray);color:var(--text);min-height:100vh}
.header{background:var(--main);color:#fff;padding:18px 16px}
.inner{max-width:1080px;margin:0 auto}
.header small{font-size:.72rem;opacity:.85;display:block}
.header h1{font-size:1.2rem;font-weight:900;margin-top:2px}
.tabs{max-width:1080px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tabs a{text-align:center;text-decoration:none;font-weight:900;font-size:.95rem;padding:11px 10px;border-radius:10px;border:2px solid #cfd8d2;background:#fff;color:var(--light)}
.tabs a.on{border-color:var(--c);background:var(--c);color:#fff}
.days{max-width:1080px;margin:8px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.days a{text-align:center;text-decoration:none;font-weight:700;font-size:.86rem;padding:8px;border-radius:999px;border:2px solid #cfd8e6;background:#fff;color:var(--light)}
.days a.on{border-color:var(--main);background:var(--main);color:#fff}
.back{max-width:1080px;margin:10px auto 0;padding:0 16px;font-size:.8rem}
.back a{color:var(--c);font-weight:700;text-decoration:none}
@media (max-width:520px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.main{max-width:1080px;margin:14px auto 30px;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.player{background:#111;border-radius:var(--radius);overflow:hidden;display:flex;justify-content:center}
video{display:block;width:100%;max-width:520px;aspect-ratio:9/16;background:#111}
.side{min-width:0}
.box{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:12px}
.box h2{font-size:.95rem;font-weight:900;margin-bottom:8px;color:var(--c)}
.lead{font-size:.86rem;line-height:1.75}
.lead b{color:var(--c)}
.chap{list-style:none;display:grid;gap:6px}
.chap button{width:100%;display:grid;grid-template-columns:5.4em minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;font-family:inherit;font-size:.88rem;border:1.5px solid #e2e6e3;background:#fff;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--text)}
.chap button:hover,.chap button:focus-visible{border-color:var(--c);outline:none}
.chap .st{font-size:.72rem;font-weight:900;color:var(--c);white-space:nowrap}
.chap .tm{font-size:.74rem;color:var(--light);font-variant-numeric:tabular-nums}
.chap button.cur{background:var(--cs);border-color:var(--c);font-weight:700}
.chap button.cur .st{color:var(--acc)}
/* 旧：変更点の注記 */.upd{font-size:.78rem;line-height:1.7;margin-top:10px;padding:8px 10px;border-radius:8px;background:#fff6dc;border:1px solid #ecd9a6;color:#5a4200}
.note{font-size:.75rem;color:var(--light);line-height:1.7;margin-top:8px}
.footer{text-align:center;padding:10px 16px 30px;font-size:.72rem;color:var(--light);line-height:1.7}
@media (min-width:860px){
  .main{grid-template-columns:minmax(0,430px) minmax(0,1fr);align-items:start}
  .player{position:sticky;top:14px}
  video{width:auto;height:min(calc(100vh - 40px),764px);max-width:100%}
}
.tips{list-style:none;display:grid;gap:8px}
.tips li{font-size:.85rem;line-height:1.7;padding-left:1.2em;position:relative}
.tips li::before{content:'';position:absolute;left:.2em;top:.7em;width:.45em;height:.45em;border-radius:50%;background:var(--c)}
.tips b{color:var(--c)}
.tbtn{display:block;margin-top:12px;text-align:center;padding:11px;border-radius:10px;border:2px solid var(--c);color:var(--c);font-weight:900;font-size:.9rem;text-decoration:none;background:#fff}
</style>
</head>
<body>
<header class="header"><div class="inner">
  <small>第40回岩手県中学校インドアソフトテニス大会</small>
  <h1>運営スタッフ向け　係ごとの説明動画</h1>
</div></header>
<div class="back"><a href="staff.html">← 運営ポータルへ戻る</a></div>
<nav class="tabs">
  <a id="tab_reception" href="?k=reception">受付係</a>
  <a id="tab_honbu" href="?k=honbu">本部・進行係</a>
  <a id="tab_record" href="?k=record">記録・掲示係</a>
  <a id="tab_court" href="?k=court">コート係</a>
</nav>
<nav class="days">
  <a id="day_indiv">個人戦の日（11/28）</a>
  <a id="day_team">団体戦の日（11/29）</a>
</nav>

<main class="main">
  <div class="player">
    <video id="vid" controls playsinline preload="metadata"></video>
  </div>
  <div class="side">
    <div class="box">
      <h2 id="ttl"></h2>
      <p class="lead" id="lead"></p>
      <p class="note">音声はありません（字幕で説明しています）。画面は見本で、学校名・選手名は架空です。詳しくは当日運営マニュアルも見てください。</p>
    </div>
    <div class="box">
      <h2>見たいところから再生</h2>
      <ul class="chap" id="chap"></ul>
    </div>
    <div class="box">
      <h2>当日の画面で</h2>
      <ul class="tips" id="tips"></ul>
      <a class="tbtn" href="practice/">🧪 実際の画面で練習する（練習用）</a>
    </div>
  </div>
</main>
<div class="footer">岩手県中学生ソフトテニス連盟</div>

<script>

      chap: [[0, 'はじめに'], [4, '使うもの'], [14.2, '1試合の流れ'], [26.8, '「本部 進行管理」を開く', 1], [32.3, '画面の見方', 2], [38.3, 'オーダーの提出状況', 3], [44.3, '未提出は代理入力', 4], [49.8, '「コール」', 5], [55.3, 'あいさつで「オーダー公開」', 6], [61.3, '「開始」', 7], [66.3, '「マッチ結果」を入れる', 8], [73.8, '決着したら放送文', 9], [80.3, 'コート集合・締切を直す', 10], [85.8, '進行の調整', 11], [91.8, '目安時間を変える', 12], [97.8, 'こんなときは'], [110.4, 'まとめ'], [120.6, 'おわりに']] }
  },
  record: {

    team: { title: '記録・掲示係　団体戦の日（11/29）', src: 'video/staff_record_team.mp4', poster: 'video/staff_record_team.jpg',
      lead: '前日の印刷（<b>団体戦用スコアシート・白紙の組合せ・進行表の二次元コード</b>）と、当日のシートの配布・回収、<b>選手変更一覧の掲示</b>、表彰の準備まで。（約1分30秒）',
      chap: [[0, 'はじめに'], [4, '仕事'], [16.6, '「スコアシート印刷」を開く', 1], [21.6, 'コートと範囲を選ぶ', 2], [27.1, '団体戦用のシート', 3], [33.1, '白紙の予備も印刷', 4], [38.1, '組合せ（白紙）', 5], [43.1, '組合せ（結果入り）', 6], [48.6, '進行表の二次元コード', 7], [54.6, '選手変更一覧を掲示', 8], [60.6, '表彰の準備', 9], [66.6, '当日のスコアシート'], [74.4, 'まとめ'], [84.6, 'おわりに']] }
  },
  court: {
    indiv: { title: 'コート係　個人戦の日（11/28）', src: 'video/staff_court_indiv.mp4', poster: 'video/staff_court_indiv.jpg',
      lead: '個人戦用スコアシートの確認、<b>7ゲーム</b>の記録とファイナルゲーム、リタイアの<b>「④-R」</b>、勝者サインのあと<b>すぐ本部へ</b>届けるまで。（約1分20秒）',
      chap: [[0, 'はじめに'], [4, '1試合の流れ'], [16.6, 'シートを受け取る', 1], [20.6, '試合番号とコートを確かめる', 2], [26.1, '審判をそろえる', 3], [31.6, '選手を確かめる', 4], [36.6, '試合を記録する', 5], [42.1, 'ファイナルゲーム', 6], [47.6, 'リタイア・不戦勝', 7], [53.1, '勝者サイン → 本部へ', 8], [59.6, '審判員が審判をする試合'], [67.4, 'まとめ'], [77.6, 'おわりに']] },
    team: { title: 'コート係　団体戦の日（11/29）', src: 'video/staff_court_team.mp4', poster: 'video/staff_court_team.jpg',
      lead: '団体戦用スコアシートの確認、1対戦5ゲーム、<b>2回戦からは2勝で終了</b>、リタイアの<b>「③-R」</b>、勝者サインのあと<b>すぐ本部へ</b>届けるまで。（約1分20秒）',
      chap: [[0, 'はじめに'], [4, '1試合の流れ'], [16.6, 'シートを受け取る', 1], [20.6, '試合番号とコートを確かめる', 2], [26.1, 'チームを確かめる', 3], [31.6, 'マッチごとの選手', 4], [37.1, '試合を記録する', 5], [42.6, '第何マッチまで行うか', 6], [49.1, 'リタイア・不戦勝', 7], [54.6, '勝者サイン → 本部へ', 8], [60.6, '決勝は2面展開'], [68.4, 'まとめ'], [78.6, 'おわりに']] }
  }
};

/* 当日の画面で知っておくこと（係・日ごと。動画のあとで増えた操作も、その係に関係するものだけ） */
var TIPS = {
  reception: {
    indiv: ['一覧に<b>「📝 変更申請中」</b>と出ているチームは、開くと申請の状況（申請中・許可・却下）がわかります。「どうなりましたか」と聞かれたら、それを伝えます。受付はそのまま進めてかまいません。'],
    team: ['一覧に<b>「📝 変更申請中」</b>と出ているチームは、開くと申請の状況（申請中・許可・却下）がわかります。「どうなりましたか」と聞かれたら、それを伝えます。受付はそのまま進めてかまいません。']
  },
  honbu: {
    indiv: ['コート集合は自動で出ます（各コートの1試合目は9:00、2試合目からは前の試合が終わり次第、決勝トーナメントの各コート最初の試合は「本部のコールで」）。時刻を決めたら、カードの<b>「⏱ 集合」</b>で入れられます。',
      'リタイア・不戦勝のスコアは、勝った側から見て<b>「④-R」</b>と入れます（ボタンがあります）。'],
    team: ['結果は<b>「マッチ結果」</b>から入れます。決着すると<b>「📢 放送文」</b>（結果と次の試合のオーダー締切）が出るので、読み上げます。',
      'コート集合・オーダー締切は自動で出ます。直すときはカードの<b>「⏱ 集合・締切」</b>で（空欄で保存すると自動に戻ります）。',
      '選手6名未満のチームの第3マッチは、自動で<b>「欠員（不戦敗）」</b>になります。リタイア・不戦勝のマッチは、勝った側から見て「③-R」です。']
  },
  record: {
    indiv: ['選手変更一覧は、受付終了（8:00）で<b>「🔒 この一覧で確定」</b>と出ます。確定したら印刷して掲示し、本部に伝えます。'],
    team: ['選手変更一覧は、受付終了（8:00）で<b>「🔒 この一覧で確定」</b>と出ます。確定したら印刷して掲示し、本部に伝えます。']
  },
  court: {
    indiv: ['リタイア・不戦勝のときは、スコアを勝った側から見て<b>「④-R」</b>と書きます（Rはリタイアメント）。'],
    team: ['リタイア・不戦勝のマッチは、スコアを勝った側から見て<b>「③-R」</b>と書きます。']
  }

var q = new URLSearchParams(location.search);
var key = q.get('k');
if (!DATA[key]) key = 'reception';
/* 日：指定がなければ、11/28までは個人戦の日、それ以降は団体戦の日 */
var day = q.get('d');
if (day !== 'team' && day !== 'indiv') day = new Date() < new Date('2026-11-29T00:00:00+09:00') ? 'indiv' : 'team';
var D = DATA[key][day];
var vid = document.getElementById('vid');

function mmss(s) {
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
}

function init() {
  var r = ['reception', 'honbu', 'record', 'court'];
  var i0;
  for (i0 = 0; i0 < r.length; i0++) {
    var a = document.getElementById('tab_' + r[i0]);
    a.href = '?k=' + r[i0] + '&d=' + day;
    a.className = r[i0] === key ? 'on' : '';
  }
  document.getElementById('day_indiv').href = '?k=' + key + '&d=indiv';
  document.getElementById('day_team').href = '?k=' + key + '&d=team';
  document.getElementById('day_' + day).className = 'on';
  document.getElementById('ttl').textContent = D.title;
  document.getElementById('lead').innerHTML = D.lead;
  document.title = D.title + '（動画）｜県インドア大会';
  vid.poster = D.poster;
  vid.src = D.src;
  var steps = 0;
  var i;
  for (i = 0; i < D.chap.length; i++) if (D.chap[i][2]) steps++;
  var h = '';
  for (i = 0; i < D.chap.length; i++) {
    var c = D.chap[i];
    h += '<li><button type="button" data-i="' + i + '" onclick="jump(' + i + ')"><span class="st">' + (c[2] ? 'STEP ' + c[2] + '/' + steps : '') + '</span><span>' + c[1] + '</span><span class="tm">' + mmss(c[0]) + '</span></button></li>';
  }
  document.getElementById('chap').innerHTML = h;
  document.getElementById('tips').innerHTML = '<li>' + TIPS[key][day].join('</li><li>') + '</li>';
}

function jump(i) {
  vid.currentTime = D.chap[i][0] + 0.05;
  mark(D.chap[i][0] + 0.05);
  var p = vid.play();
  if (p && p.catch) p.catch(function () {});
  if (window.innerWidth < 860) vid.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function mark(at) {
  var t = typeof at === 'number' ? at : vid.currentTime;
  var cur = 0;
  var i;
  for (i = 0; i < D.chap.length; i++) if (t >= D.chap[i][0]) cur = i;
  var bs = document.querySelectorAll('.chap button');
  for (i = 0; i < bs.length; i++) bs[i].className = +bs[i].getAttribute('data-i') === cur ? 'cur' : '';
}

vid.addEventListener('timeupdate', function () { mark(); });
vid.addEventListener('seeked', function () { mark(); });
init();
mark();
</script>
</body>
</html>
